<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CLS OS — What's New Editor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--slate:#2f4f4f;--teal:#51897d;--gold:#d79068;--cream:#f5f0e8;--danger:#c0544a;--success:#3d8c6e;--text:#1e3333;--muted:#6b8c8c;--light:#f4f7f6;--light2:#e8edec;--white:#fff;--border:#dce5e3;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--light);color:var(--text);min-height:100vh;}
button{cursor:pointer;border:none;font-family:inherit;}
.btn{padding:8px 16px;border-radius:8px;font-weight:500;font-size:13px;transition:all .15s;}
.btn-teal{background:var(--teal);color:#fff;}.btn-teal:hover{background:#3d6b61;}
.btn-gold{background:var(--gold);color:#fff;}.btn-gold:hover{background:#c07b52;}
.btn-outline{background:none;border:1.5px solid var(--border);color:var(--text);}.btn-outline:hover{border-color:var(--teal);color:var(--teal);}
.btn-danger{background:var(--danger);color:#fff;font-size:11px;padding:5px 12px;border-radius:6px;}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px;}
.sinput{border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13px;background:var(--white);width:100%;transition:border .15s;}
.sinput:focus{outline:none;border-color:var(--teal);}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
.field{margin-bottom:12px;}.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.header{background:var(--slate);color:var(--cream);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.header h1{font-size:18px;font-weight:700;flex:1;}
.header .sub{font-size:11px;color:rgba(245,240,232,0.6);}
.main{max-width:800px;margin:0 auto;padding:20px;}
.notify{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:300;color:#fff;}
.post-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;transition:all .15s;}
.post-card:hover{box-shadow:0 2px 12px rgba(47,79,79,0.06);}
.post-img{width:100%;height:180px;object-fit:cover;display:block;}
.post-body{padding:16px;}
.post-title{font-size:16px;font-weight:700;color:var(--slate);margin-bottom:4px;}
.post-date{font-size:11px;color:var(--muted);margin-bottom:8px;}
.post-desc{font-size:13px;color:rgba(47,79,79,0.7);line-height:1.6;margin-bottom:10px;}
.post-actions{display:flex;gap:8px;flex-wrap:wrap;}
.badge-active{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:600;background:rgba(61,140,110,0.1);color:var(--success);}
.badge-draft{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:600;background:rgba(107,128,128,0.1);color:var(--muted);}
.modal-ov{position:fixed;inset:0;background:rgba(30,51,51,0.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-ov.open{display:flex;}
.modal-box{background:var(--white);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;}
.preview-card{background:var(--cream);border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px dashed rgba(47,79,79,0.15);}
.preview-card img{width:100%;border-radius:8px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📰 What's New — Editor</h1>
    <div class="sub">CLS OS — Manage announcements & promos</div>
    <div class="sub" id="post-count" style="margin-top:2px;"></div>
  </div>
  <button class="btn btn-outline" style="color:var(--cream);border-color:rgba(245,240,232,0.3);" onclick="syncAll()">🔄 Sync</button>
  <button class="btn btn-outline" style="color:var(--cream);border-color:rgba(245,240,232,0.3);" onclick="toggleSettings()">⚙</button>
</div>

<div class="main">
  <!-- Settings -->
  <div id="settings-panel" style="display:none;" class="card">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">⚙ Connection Settings</div>
    <div class="field">
      <label>Apps Script URL</label>
      <input type="url" id="cfg-url" class="sinput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-teal" onclick="saveSettings()">💾 Save & Sync</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
    <button class="btn btn-gold" onclick="openEditor(null)">+ New Post</button>
    <div style="flex:1;"></div>
    <select id="filter-status" class="sinput" style="width:auto;" onchange="renderPosts()">
      <option value="all">All Posts</option>
      <option value="active">Active Only</option>
      <option value="draft">Drafts Only</option>
    </select>
  </div>

  <!-- Posts list -->
  <div id="posts-list"></div>

  <!-- Homepage embed code -->
  <div class="card" style="margin-top:24px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">📋 Embed Code for Your Homepage</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Copy this code and paste it into your website where you want the "What's New" section to appear.</div>
    <textarea id="embed-code" class="sinput" rows="6" readonly style="font-family:monospace;font-size:11px;background:var(--light);"></textarea>
    <button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="copyEmbed()">📋 Copy Code</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-cnt"></div>
</div>

<script>
var POSTS = [];

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'}); }
function getUrl(){ return 'https://script.google.com/macros/s/AKfycbx_Y5nH34Rq16JJ2AxBDr30ttmDFuic61OqoC0u3Wq0zogHEhfoV6qE7uiNagI43flVgw/exec'; }
function hasUrl(){ return !!getUrl(); }

function notify(msg, type){
  var el = document.createElement('div');
  el.className = 'notify';
  el.textContent = msg;
  el.style.background = type==='error'?'var(--danger)':type==='info'?'var(--slate)':'var(--success)';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

function openModal(html){ document.getElementById('modal-cnt').innerHTML=html; document.getElementById('modal-ov').classList.add('open'); }
function closeModal(){ document.getElementById('modal-ov').classList.remove('open'); }

function toggleSettings(){
  var el = document.getElementById('settings-panel');
  el.style.display = el.style.display==='none' ? '' : 'none';
}
function saveSettings(){
  var url = (document.getElementById('cfg-url').value||'').trim();
  if(!url){ notify('Enter URL','error'); return; }
  localStorage.setItem('cl_announce_url', url);
  notify('Saved ✓','success');
  document.getElementById('settings-panel').style.display = 'none';
  syncAll();
}

// JSONP gasCall
function gasCall(action, payload, retryCount){
  if(!retryCount) retryCount = 0;
  return new Promise(function(resolve, reject){
    if(!hasUrl()){ reject(new Error('No URL')); return; }
    var cbName = '_gcb_'+uid();
    var timeout = setTimeout(function(){
      delete window[cbName];
      if(retryCount < 2){ resolve(gasCall(action, payload, retryCount+1)); }
      else{ reject(new Error('Timeout')); }
    }, 45000);
    window[cbName] = function(data){ clearTimeout(timeout); delete window[cbName]; resolve(data); };
    var dataObj = JSON.stringify({action: action, payload: payload||{}});
    var encoded = btoa(unescape(encodeURIComponent(dataObj)));
    var s = document.createElement('script');
    s.src = getUrl()+'?d='+encodeURIComponent(encoded)+'&callback='+cbName;
    s.onerror = function(){ clearTimeout(timeout); delete window[cbName]; reject(new Error('Network error')); };
    document.body.appendChild(s);
    setTimeout(function(){ try{document.body.removeChild(s);}catch(e){} }, 5000);
  });
}

function loadPosts(){
  try{ var s = localStorage.getItem('cl_announcements'); if(s) POSTS = JSON.parse(s); }catch(e){ POSTS=[]; }
}
function savePosts(){
  try{ localStorage.setItem('cl_announcements', JSON.stringify(POSTS)); }catch(e){}
}

async function syncAll(){
  if(!hasUrl()){ notify('Set URL in Settings','error'); return; }
  notify('Syncing…','info');
  try{
    var r = await gasCall('getAnnouncements');
    if(r.ok && Array.isArray(r.data)){
      POSTS = r.data;
      savePosts();
      notify('Synced ✓ — '+POSTS.length+' posts','success');
    } else {
      notify('Sync issue: '+(r.error||'No data'),'error');
    }
  }catch(e){ notify('Sync error: '+e.message,'error'); }
  renderPosts();
  updateEmbed();
}

function renderPosts(){
  var el = document.getElementById('posts-list');
  var filter = (document.getElementById('filter-status')||{}).value||'all';
  var posts = POSTS.slice().sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
  if(filter==='active') posts = posts.filter(function(p){ return p.active==='yes'||p.active===true; });
  if(filter==='draft') posts = posts.filter(function(p){ return p.active!=='yes'&&p.active!==true; });

  document.getElementById('post-count').textContent = POSTS.length+' total posts';

  if(!posts.length){ el.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px;font-size:13px;">No posts yet. Click "+ New Post" to create one!</div>'; return; }

  var html = '';
  posts.forEach(function(p){
    var isActive = p.active==='yes'||p.active===true;
    html += '<div class="post-card">'+
      (p.imageUrl ? '<img class="post-img" src="'+escHtml(p.imageUrl)+'" alt="'+escHtml(p.title)+'" onerror="this.style.display=\'none\'">' : '')+
      '<div class="post-body">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'+
          '<span class="'+(isActive?'badge-active':'badge-draft')+'">'+(isActive?'● Active':'○ Draft')+'</span>'+
          '<span class="post-date">'+escHtml(p.date||'')+'</span>'+
        '</div>'+
        '<div class="post-title">'+escHtml(p.title||'Untitled')+'</div>'+
        '<div class="post-desc">'+escHtml(String(p.description||'').slice(0,150))+(String(p.description||'').length>150?'…':'')+'</div>'+
        (p.linkUrl?'<div style="font-size:11px;color:var(--teal);margin-bottom:8px;">🔗 '+escHtml(p.linkUrl)+'</div>':'')+
        '<div class="post-actions">'+
          '<button class="btn btn-sm btn-teal" data-pid="'+p.id+'" onclick="openEditor(this.dataset.pid)">✏ Edit</button>'+
          '<button class="btn btn-sm btn-outline" data-pid="'+p.id+'" onclick="toggleActive(this.dataset.pid)">'+(isActive?'⏸ Unpublish':'▶ Publish')+'</button>'+
          '<button class="btn btn-sm btn-danger" data-pid="'+p.id+'" onclick="deletePost(this.dataset.pid)">🗑</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  });
  el.innerHTML = html;
}

function openEditor(id){
  var p = id ? POSTS.find(function(x){return x.id===id;}) : null;
  var isNew = !p;

  var html =
    '<h3 style="margin-bottom:16px;">'+(isNew?'+ New Post':'✏ Edit Post')+'</h3>'+
    '<div class="field"><label>Title *</label>'+
      '<input type="text" id="ed-title" class="sinput" value="'+escHtml(p?p.title:'')+'" placeholder="e.g. New Promo: 50% Off Couple Shoots!" oninput="updatePreview()"></div>'+
    '<div class="field"><label>Description</label>'+
      '<textarea id="ed-desc" class="sinput" rows="3" placeholder="Short description of the announcement..." oninput="updatePreview()">'+escHtml(p?p.description:'')+'</textarea></div>'+
    '<div class="field"><label>Image URL (poster/flyer)</label>'+
      '<input type="url" id="ed-img" class="sinput" value="'+escHtml(p?p.imageUrl:'')+'" placeholder="https://example.com/poster.jpg" oninput="updatePreview()">'+
      '<div style="font-size:10px;color:var(--muted);margin-top:3px;">Upload your image to Google Drive or Imgur, then paste the direct link here.</div></div>'+
    '<div class="field"><label>Link URL (optional)</label>'+
      '<input type="url" id="ed-link" class="sinput" value="'+escHtml(p?p.linkUrl:'')+'" placeholder="https://your-booking-link.com"></div>'+
    '<div class="field"><label>Link Button Text</label>'+
      '<input type="text" id="ed-linktext" class="sinput" value="'+escHtml(p?p.linkText||'Learn More':'Learn More')+'" placeholder="e.g. Book Now, Learn More"></div>'+
    '<div class="field"><label>Status</label>'+
      '<select id="ed-active" class="sinput"><option value="yes"'+(p&&(p.active==='yes'||p.active===true)?' selected':(!p?' selected':''))+'>Active (visible on website)</option><option value="no"'+(p&&p.active!=='yes'&&p.active!==true?' selected':'')+'>Draft (hidden)</option></select></div>'+
    '<div id="ed-preview" class="preview-card" style="display:none;"></div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;">'+
      '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>'+
      '<button class="btn btn-teal" id="ed-save-btn" onclick="savePost(\''+escHtml(p?p.id:'')+'\')">💾 '+(isNew?'Publish Post':'Save Changes')+'</button>'+
    '</div>';
  openModal(html);
  setTimeout(updatePreview, 100);
}

function updatePreview(){
  var title = (document.getElementById('ed-title')||{}).value||'';
  var desc  = (document.getElementById('ed-desc')||{}).value||'';
  var img   = (document.getElementById('ed-img')||{}).value||'';
  var el = document.getElementById('ed-preview');
  if(!el) return;
  if(!title && !img){ el.style.display='none'; return; }
  el.style.display='';
  el.innerHTML = '<div style="font-size:10px;color:var(--muted);margin-bottom:6px;">PREVIEW</div>'+
    (img?'<img src="'+escHtml(img)+'" style="width:100%;border-radius:8px;margin-bottom:10px;max-height:200px;object-fit:cover;" onerror="this.style.display=\'none\'">':'')+
    '<div style="font-weight:700;font-size:15px;color:var(--slate);">'+escHtml(title)+'</div>'+
    (desc?'<div style="font-size:12px;color:var(--muted);margin-top:4px;">'+escHtml(desc)+'</div>':'');
}

async function savePost(existingId){
  var title   = (document.getElementById('ed-title').value||'').trim();
  var desc    = (document.getElementById('ed-desc').value||'').trim();
  var img     = (document.getElementById('ed-img').value||'').trim();
  var link    = (document.getElementById('ed-link').value||'').trim();
  var linkTxt = (document.getElementById('ed-linktext').value||'').trim()||'Learn More';
  var active  = document.getElementById('ed-active').value;

  if(!title){ notify('Title is required','error'); return; }

  var btn = document.getElementById('ed-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }

  var post;
  if(existingId){
    post = POSTS.find(function(x){return x.id===existingId;});
    if(post){
      post.title=title; post.description=desc; post.imageUrl=img;
      post.linkUrl=link; post.linkText=linkTxt; post.active=active;
    }
  } else {
    post = { id:uid(), date:todayStr(), title:title, description:desc, imageUrl:img, linkUrl:link, linkText:linkTxt, active:active };
    POSTS.push(post);
  }

  savePosts();
  if(hasUrl()){
    try{ await gasCall('saveAnnouncement', post); }catch(e){}
  }
  notify(existingId?'Post updated ✓':'Post published ✓','success');
  closeModal();
  renderPosts();
  updateEmbed();
}

async function deletePost(id){
  if(!confirm('Delete this post?')) return;
  POSTS = POSTS.filter(function(x){return x.id!==id;});
  savePosts();
  if(hasUrl()){ try{ await gasCall('deleteAnnouncement',{id:id}); }catch(e){} }
  renderPosts();
  updateEmbed();
  notify('Deleted','info');
}

async function toggleActive(id){
  var p = POSTS.find(function(x){return x.id===id;});
  if(!p) return;
  p.active = (p.active==='yes'||p.active===true) ? 'no' : 'yes';
  savePosts();
  if(hasUrl()){ try{ await gasCall('saveAnnouncement', p); }catch(e){} }
  renderPosts();
  updateEmbed();
  notify(p.active==='yes'?'Published ✓':'Unpublished','success');
}

function updateEmbed(){
  var url = getUrl();
  var code = '<div id="cls-whats-new"></div>\n<script>\n(function(){\n  var GAS="'+url+'";\n  function cb(d){\n    if(!d.ok||!d.data)return;\n    var posts=d.data.filter(function(p){return p.active==="yes"||p.active===true;}).sort(function(a,b){return(b.date||\"\").localeCompare(a.date||\"\");}).slice(0,6);\n    if(!posts.length)return;\n    var el=document.getElementById("cls-whats-new");\n    var h=\'<div style="max-width:1100px;margin:40px auto;padding:0 20px;"><h2 style="font-family:Playfair Display,Georgia,serif;font-size:2rem;text-align:center;color:#2f4f4f;margin-bottom:.4rem;">What\\\'s New</h2><p style="text-align:center;font-size:.9rem;color:#6b8c8c;margin-bottom:1.5rem;">Latest updates, promos &amp; announcements</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">\';\n    posts.forEach(function(p){\n      h+=\'<div style="background:#fff;border-radius:14px;overflow:hidden;border:1px solid #dce5e3;transition:all .2s;" onmouseover="this.style.boxShadow=\\\'0 4px 16px rgba(47,79,79,0.08)\\\'" onmouseout="this.style.boxShadow=\\\'none\\\'">\';\n      if(p.imageUrl) h+=\'<img src="\'+p.imageUrl+\'" style="width:100%;height:200px;object-fit:cover;" onerror="this.style.display=\\\'none\\\'">\';\n      h+=\'<div style="padding:16px;"><div style="font-size:.7rem;color:#6b8c8c;">\'+p.date+\'</div><div style="font-size:1.05rem;font-weight:700;color:#2f4f4f;margin:4px 0 6px;">\'+p.title+\'</div><p style="font-size:.85rem;color:#6b8c8c;line-height:1.6;">\'+p.description+\'</p>\';\n      if(p.linkUrl) h+=\'<a href="\'+p.linkUrl+\'" target="_blank" style="display:inline-block;margin-top:10px;background:#d79068;color:#fff;padding:8px 20px;border-radius:8px;text-decoration:none;font-size:.8rem;font-weight:600;">\'+( p.linkText||"Learn More")+\'</a>\';\n      h+=\'</div></div>\';\n    });\n    h+=\'</div></div>\';\n    el.innerHTML=h;\n  }\n  var n="_cls_news_"+Math.random().toString(36).slice(2);\n  window[n]=function(d){cb(d);delete window[n];};\n  var s=document.createElement("script");\n  s.src=GAS+"?d="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({action:"getAnnouncements",payload:{}})))))+"&callback="+n;\n  document.body.appendChild(s);\n})();\n<\/script>';
  var ta = document.getElementById('embed-code');
  if(ta) ta.value = code;
}

function copyEmbed(){
  var ta = document.getElementById('embed-code');
  if(ta){ ta.select(); document.execCommand('copy'); notify('Copied!','success'); }
}

// Init
loadPosts();
var urlEl = document.getElementById('cfg-url');
if(urlEl) urlEl.value = getUrl();
if(!hasUrl()) document.getElementById('settings-panel').style.display = '';
renderPosts();
updateEmbed();
if(hasUrl()) syncAll();
</script>
</body>
</html>
